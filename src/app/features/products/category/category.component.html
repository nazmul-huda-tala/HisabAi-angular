<div class="page">
  <div class="head"><div><h1>Product Categories</h1><p>পণ্যের category তৈরি ও পরিচালনা করুন।</p></div><a routerLink="/products" class="back">Products</a></div>
  <div class="grid"><section class="card form"><h2>{{editingId ? 'Edit Category':'Add Category'}}</h2><input [(ngModel)]="name" placeholder="Category name"/><textarea [(ngModel)]="description" placeholder="Description"></textarea><div class="actions"><button (click)="save()">{{editingId?'Update':'Save'}}</button><button class="light" *ngIf="editingId" (click)="reset()">Cancel</button></div><small>{{message}}</small></section>
  <section class="card"><div class="toolbar"><input [(ngModel)]="search" placeholder="Search category..."/><b>{{filtered.length}} categories</b></div><table><thead><tr><th>Name</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let x of filtered"><td>{{x.name}}</td><td>{{x.description||'—'}}</td><td><button class="status" [class.off]="!x.active" (click)="toggle(x)">{{x.active?'Active':'Inactive'}}</button></td><td><button (click)="edit(x)">Edit</button><button class="danger" (click)="remove(x)">Delete</button></td></tr><tr *ngIf="!filtered.length"><td colspan="4">No categories found.</td></tr></tbody></table></section></div>
</div>
