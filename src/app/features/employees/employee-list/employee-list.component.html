<div class="page"><div class="head"><div><h1>Employees</h1><p>কর্মীদের তথ্য ও active status পরিচালনা করুন।</p></div><a routerLink="/employees/new" class="add">+ Add Employee</a></div><section class="card"><div class="toolbar"><input [(ngModel)]="search" placeholder="Search name, email or role..."><b>{{filtered.length}} employees</b></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Department</th><th>Salary</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let e of filtered"><td><strong>{{e.name}}</strong><br><small>{{e.email}}</small></td><td>{{e.phone}}</td><td>{{e.role}}</td><td>{{e.department}}</td><td>৳{{e.salary | number:'1.0-0'}}</td><td><button class="status" [class.off]="!e.active" (click)="toggle(e)">{{e.active?'Active':'Inactive'}}</button></td><td><a [routerLink]="['/employees',e.id,'edit']">Edit</a><button class="danger" (click)="remove(e.id)">Delete</button></td></tr><tr *ngIf="!filtered.length"><td colspan="7">No employees found.</td></tr></tbody></table></div></section></div>
