<div class="page"><div class="head"><div><h1>{{id ? 'Edit Employee':'Add Employee'}}</h1><p>কর্মীর basic information সংরক্ষণ করুন।</p></div><a routerLink="/employees">Back</a></div><form class="card" (ngSubmit)="save()"><div class="grid"><label>Name *<input name="name" [(ngModel)]="model.name" required></label><label>Email<input type="email" name="email" [(ngModel)]="model.email"></label><label>Phone *<input name="phone" [(ngModel)]="model.phone" required></label><label>Role<select name="role" [(ngModel)]="model.role"><option>Cashier</option><option>Manager</option><option>Inventory Staff</option><option>Accountant</option><option>Employee</option></select></label><label>Department<select name="department" [(ngModel)]="model.department"><option>Sales</option><option>Inventory</option><option>Accounts</option><option>Administration</option></select></label><label>Salary<input type="number" min="0" name="salary" [(ngModel)]="model.salary"></label></div><label class="check"><input type="checkbox" name="active" [(ngModel)]="model.active"> Active employee</label><div class="actions"><button type="submit">{{id?'Update':'Save Employee'}}</button><a routerLink="/employees">Cancel</a></div></form></div>
