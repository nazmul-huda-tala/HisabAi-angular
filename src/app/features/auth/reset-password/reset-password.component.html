<div class="auth-container">
  <div class="auth-card">
    <h2>Set New Password</h2>
    <p class="subtitle">Please enter your new password below.</p>

    <!-- Success Alert -->
    <div *ngIf="isSuccess" class="alert-success">
      Your password has been successfully reset! 
      <br />
      <a routerLink="/auth/login" class="login-link">Click here to Login</a>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="alert-danger">
      {{ errorMessage }}
    </div>

    <!-- Reset Form -->
    <form *ngIf="!isSuccess" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          type="password" 
          id="newPassword" 
          formControlName="newPassword" 
          placeholder="Enter new password"
          [class.invalid]="resetPasswordForm.get('newPassword')?.touched && resetPasswordForm.get('newPassword')?.invalid"
        />
        <small *ngIf="resetPasswordForm.get('newPassword')?.touched && resetPasswordForm.get('newPassword')?.errors?.['required']">
          New password is required.
        </small>
        <small *ngIf="resetPasswordForm.get('newPassword')?.touched && resetPasswordForm.get('newPassword')?.errors?.['minlength']">
          Password must be at least 6 characters long.
        </small>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          formControlName="confirmPassword" 
          placeholder="Re-enter new password"
          [class.invalid]="resetPasswordForm.get('confirmPassword')?.touched && resetPasswordForm.get('confirmPassword')?.invalid"
        />
        <small *ngIf="resetPasswordForm.get('confirmPassword')?.touched && resetPasswordForm.get('confirmPassword')?.errors?.['required']">
          Confirming password is required.
        </small>
        <small *ngIf="resetPasswordForm.get('confirmPassword')?.touched && resetPasswordForm.get('confirmPassword')?.errors?.['passwordMismatch']">
          Passwords do not match.
        </small>
      </div>

      <button type="submit" [disabled]="resetPasswordForm.invalid || isLoading || !token" class="btn-submit">
        {{ isLoading ? 'Updating...' : 'Update Password' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Back to <a routerLink="/auth/login">Login</a></p>
    </div>
  </div>
</div>
