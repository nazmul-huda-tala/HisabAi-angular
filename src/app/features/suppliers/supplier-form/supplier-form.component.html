<div class="form-card" *ngIf="!notFound()">
  <!-- Header -->
  <div class="form-header">
    <div class="header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    </div>
    <div>
      <h2>{{ isEditMode ? 'সাপ্লাইয়ার এডিট করুন' : 'নতুন সাপ্লাইয়ার যোগ করুন' }}</h2>
      <p>সরবরাহকারীর বিস্তারিত তথ্য প্রদান করুন</p>
    </div>
  </div>

  <!-- Form -->
  <div class="api-error" *ngIf="saveError()">{{ saveError() }}</div>

<form [formGroup]="supplierForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">

      <!-- Company/Supplier Name -->
      <div class="form-group full-width">
        <label for="companyName">কোম্পানি/সাপ্লাইয়ারের নাম <span class="required">*</span></label>
        <input id="companyName" type="text" formControlName="companyName" placeholder="যেমন: এসিআই লিমিটেড"
               [class.error]="supplierForm.get('companyName')?.invalid && supplierForm.get('companyName')?.touched" />
        <span class="error-msg" *ngIf="supplierForm.get('companyName')?.invalid && supplierForm.get('companyName')?.touched">
          সঠিক নাম প্রদান করুন (নূন্যতম ৩ অক্ষর)
        </span>
      </div>

      <!-- Contact Person -->
      <div class="form-group">
        <label for="contactPerson">যোগাযোগকারী ব্যক্তি (ঐচ্ছিক)</label>
        <input id="contactPerson" type="text" formControlName="contactPerson" placeholder="যেমন: মো: রহিম আহমেদ"
               [class.error]="supplierForm.get('contactPerson')?.invalid && supplierForm.get('contactPerson')?.touched" />
      </div>

      <!-- Phone Number -->
      <div class="form-group">
        <label for="phone">মোবাইল নম্বর <span class="required">*</span></label>
        <input id="phone" type="tel" formControlName="phone" placeholder="+880 1XXX-XXXXXX"
               [class.error]="supplierForm.get('phone')?.invalid && supplierForm.get('phone')?.touched" />
        <span class="error-msg" *ngIf="supplierForm.get('phone')?.invalid && supplierForm.get('phone')?.touched">
          সঠিক মোবাইল নম্বর লিখুন
        </span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">ইমেইল (ঐচ্ছিক)</label>
        <input id="email" type="email" formControlName="email" placeholder="example@domain.com"
               [class.error]="supplierForm.get('email')?.invalid && supplierForm.get('email')?.touched" />
      </div>

      <!-- Payment Terms -->
      <div class="form-group">
        <label for="paymentTerms">পেমেন্ট শর্ত <span class="required">*</span></label>
        <select id="paymentTerms" formControlName="paymentTerms">
          <option *ngFor="let t of termsOptions" [value]="t">{{ termsLabels[t] }}</option>
        </select>
      </div>

      <!-- Opening Balance -->
      <div class="form-group">
        <label for="openingBalance">পূর্বের বকেয়া/ব্যালেন্স (৳)</label>
        <input id="openingBalance" type="number" formControlName="openingBalance" placeholder="0.00" min="0" />
      </div>

      <!-- Status -->
      <div class="form-group">
        <label for="status">অবস্থা</label>
        <select id="status" formControlName="status">
          <option value="active">সক্রিয়</option>
          <option value="inactive">নিষ্ক্রিয়</option>
        </select>
      </div>

      <!-- Address -->
      <div class="form-group full-width">
        <label for="address">ঠিকানা <span class="required">*</span></label>
        <textarea id="address" formControlName="address" rows="2" placeholder="সাপ্লাইয়ারের পূর্ণাঙ্গ ঠিকানা লিখুন..."
                  [class.error]="supplierForm.get('address')?.invalid && supplierForm.get('address')?.touched"></textarea>
      </div>

      <!-- Note -->
      <div class="form-group full-width">
        <label for="note">নোট (ঐচ্ছিক)</label>
        <textarea id="note" formControlName="note" rows="2" placeholder="অতিরিক্ত তথ্য..."></textarea>
      </div>

    </div>

    <!-- Actions -->
    <div class="form-actions">
      <a class="btn btn-secondary" routerLink="/suppliers">বাতিল</a>
      <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
        {{ isSaving() ? 'সংরক্ষণ হচ্ছে...' : (isEditMode ? 'হালনাগাদ করুন' : 'সাপ্লাইয়ার সেভ করুন') }}
      </button>
    </div>
  </form>
</div>

<div class="form-card" *ngIf="notFound()">
  <p style="text-align:center; padding: 24px 0; color:#64748b;">সাপ্লাইয়ার পাওয়া যায়নি।</p>
  <div class="form-actions" style="justify-content:center;">
    <a class="btn btn-secondary" routerLink="/suppliers">তালিকায় ফিরে যান</a>
  </div>
</div>
