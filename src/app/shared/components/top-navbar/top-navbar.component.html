<header class="top-navbar">
  <div class="top-navbar__left">
    <button class="top-navbar__menu-button" type="button" aria-label="মেনু খুলুন" (click)="toggleSidebar()">
      <app-icon name="menu" [size]="20" />
    </button>
    @if (showBack()) {
      <button class="top-navbar__back-button" type="button" aria-label="পেছনে যান" title="পেছনে যান" (click)="goBack()">
        <app-icon name="arrow-left" [size]="18" />
      </button>
    }
    <div>
      <p class="top-navbar__eyebrow">{{ pageEyebrow() }}</p>
      <h1>{{ pageTitle() }}</h1>
    </div>
  </div>

  <div class="top-navbar__search">
    <app-icon name="search" [size]="16" />
    <input type="search" placeholder="পণ্য, কাস্টমার বা ইনভয়েস খুঁজুন…" aria-label="অনুসন্ধান" />
  </div>

  <div class="top-navbar__actions">
    <button class="top-navbar__icon-button" type="button" aria-label="নোটিফিকেশন">
      <app-icon name="bell" [size]="17" />
      <span class="top-navbar__badge"></span>
    </button>
    <a class="top-navbar__pos-button" routerLink="/pos">
      <app-icon name="plus" [size]="15" />
      নতুন বিক্রয়
    </a>
    <button class="top-navbar__profile" type="button" aria-label="লগআউট" title="লগআউট" (click)="logout()">
      <span>AH</span>
      <span class="top-navbar__profile-name">Admin</span>
      <app-icon name="chevron-down" [size]="14" />
    </button>
  </div>
</header>
