<span class="badge" [class.success]="status.toLowerCase().includes('active')||status.toLowerCase().includes('paid')||status.toLowerCase().includes('complete')" [class.warning]="status.toLowerCase().includes('pending')||status.toLowerCase().includes('low')" [class.danger]="status.toLowerCase().includes('inactive')||status.toLowerCase().includes('due')||status.toLowerCase().includes('out')">{{status}}</span>
